<style>
:root{--dfill:rgba(255,255,255,.04);--dring:rgba(255,255,255,.82);--wand:rgba(120,120,128,.32);--tx:#fff;--mut:rgba(255,255,255,.62);--ac:#ffd60a;--blur:22px;--g1:rgba(255,255,255,.30);--g2:rgba(255,255,255,.07);--g3:rgba(255,255,255,.16);--sh:rgba(0,0,0,.28);--bgf:blur(36px) saturate(1.7) brightness(.62);--bg0:#0b0b0e;--bgg:radial-gradient(circle at 30% 20%,#3d4478,#0b0b0e 72%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--dfill:#fff;--dring:rgba(0,0,0,.3);--wand:rgba(0,0,0,.14);--tx:#000;--mut:rgba(0,0,0,.5);--ac:#e0a400;--g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.32);--g3:rgba(255,255,255,.55);--sh:rgba(0,0,0,.12);--bgf:blur(36px) saturate(1.5) brightness(1.12);--bg0:#e9ebf2;--bgg:radial-gradient(circle at 30% 20%,#fff,#c9d1e6 72%)}
html{height:100%;overflow:hidden;background:var(--bg0);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;position:relative;color:var(--tx);font-family:-apple-system,"SF Arabic","SF Pro Text","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;overflow:hidden;-webkit-tap-highlight-color:transparent}
#bg{position:absolute;inset:0;transform:scale(1.25);background:var(--bgg) center/cover;filter:var(--bgf);z-index:0;transition:background-image .4s}
.bar,#stage,#tools,#rl,#tabs{position:relative;z-index:1}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;transition:transform .18s cubic-bezier(.3,1.5,.5,1),opacity .2s}
button:active{transform:scale(.93)}
button[disabled]{opacity:.4}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* liquid glass */
.pill,.chip,#tabs,#lab,.seg,#sheet,#asp,#sheet .row,.sw,#sheet .big,#ov .card,#empty button,#ov button,.msg{position:relative;background:linear-gradient(145deg,var(--g1),var(--g2) 60%,var(--g3));-webkit-backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.08);backdrop-filter:blur(var(--blur)) saturate(190%) brightness(1.08);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.14),0 8px 22px var(--sh)}
.pill::after,.chip::after,#tabs::after,#lab::after,.seg::after,#sheet::after,#asp::after,#sheet .row::after,#sheet .big::after,#ov .card::after,#empty button::after,#ov button::after,.msg::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 38%,rgba(255,255,255,.08) 62%,rgba(255,255,255,.75));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none}
.bar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;min-height:50px;box-sizing:border-box}
.grp{display:flex;gap:8px}
.pill{border-radius:999px;height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;padding:0 18px}
.pill.done{background:linear-gradient(145deg,rgba(255,226,70,.98),rgba(255,196,0,.78));color:#000}
.pill.ic{padding:0;min-width:38px}
.pill.ic button{width:40px;height:38px;font-size:17px;display:grid;place-items:center}
.pill.ic svg{width:22px;height:22px}
#ttl{font-size:14px;font-weight:600}
.txt{color:var(--ac);font-size:15px;font-weight:600;padding:8px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:4px 14px 0;overflow:hidden;position:relative}
canvas#cv{max-width:100%;max-height:100%;display:none;border-radius:20px}
#dr{position:absolute;display:none;z-index:2;border-radius:20px;touch-action:none}
#rt{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:2px solid var(--ac);border-radius:10px;display:none;pointer-events:none;z-index:3;animation:rt .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes rt{from{transform:scale(1.6);opacity:0}to{transform:none;opacity:1}}
#empty{text-align:center;color:var(--mut);line-height:1.9}
#empty button{margin-top:14px;background:linear-gradient(145deg,rgba(255,226,70,.98),rgba(255,196,0,.78));color:#000;border-radius:999px;padding:12px 28px;font-weight:700;font-size:16px}
#lab{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;padding:6px 16px;border-radius:999px;display:none;pointer-events:none;white-space:nowrap;z-index:3}
#asp{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;gap:6px;padding:6px;border-radius:999px;max-width:94%;overflow-x:auto;scrollbar-width:none;z-index:4}
#asp button{padding:8px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
#asp button.on{background:var(--ac);color:#000;font-weight:700}
#cf{position:absolute;display:none;touch-action:none;--b:linear-gradient(#fff,#fff);box-shadow:0 0 0 9999px rgba(0,0,0,.42);background:var(--b) 0 0/22px 3px no-repeat,var(--b) 0 0/3px 22px no-repeat,var(--b) 100% 0/22px 3px no-repeat,var(--b) 100% 0/3px 22px no-repeat,var(--b) 0 100%/22px 3px no-repeat,var(--b) 0 100%/3px 22px no-repeat,var(--b) 100% 100%/22px 3px no-repeat,var(--b) 100% 100%/3px 22px no-repeat,var(--b) 50% 0/22px 3px no-repeat,var(--b) 50% 100%/22px 3px no-repeat,var(--b) 0 50%/3px 22px no-repeat,var(--b) 100% 50%/3px 22px no-repeat;border:1px solid rgba(255,255,255,.55);z-index:3}
#cf.drag{background-image:var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),var(--b),linear-gradient(90deg,transparent 33%,rgba(255,255,255,.35) 33%,rgba(255,255,255,.35) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.35) 66%,rgba(255,255,255,.35) calc(66% + 1px),transparent calc(66% + 1px)),linear-gradient(transparent 33%,rgba(255,255,255,.35) 33%,rgba(255,255,255,.35) calc(33% + 1px),transparent calc(33% + 1px),transparent 66%,rgba(255,255,255,.35) 66%,rgba(255,255,255,.35) calc(66% + 1px),transparent calc(66% + 1px))}

  const x=dr.getContext('2d'),W=dr.width,H2=dr.height;x.clearRect(0,0,W,H2);x.lineCap='round';x.lineJoin='round';
  for(const s of(ds?strokes.concat([ds]):strokes)){x.strokeStyle=s.c;x.lineWidth=s.w*W;x.beginPath();s.p.forEach((q,i)=>i?x.lineTo(q[0]*W,q[1]*H2):x.moveTo(q[0]*W,q[1]*H2));if(s.p.length===1)x.lineTo(s.p[0][0]*W+.01,s.p[0][1]*H2);x.stroke()}}
dr.onpointerdown=e=>{if(!pen)return;const r=dr.getBoundingClientRect();ds={c:PENC[penC],w:.008,p:[[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]]};try{dr.setPointerCapture(e.pointerId)}catch(_){};posOv()};
dr.onpointermove=e=>{if(!ds)return;const r=dr.getBoundingClientRect();ds.p.push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);posOv()};
dr.onpointerup=dr.onpointercancel=()=>{if(ds){strokes.push(ds);ds=null;posOv()}};

/* ---------- settings ---------- */
function applyTheme(){
  const dark=S.theme==='dark'||(S.theme==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  const r=document.documentElement;r.dataset.theme=dark?'dark':'light';r.style.setProperty('--blur',(6+S.glass*.4)+'px');
  RC.tx=dark?'#fff':'#000';RC.mut=dark?'rgba(255,255,255,.5)':'rgba(0,0,0,.4)';RC.ac=getComputedStyle(r).getPropertyValue('--ac').trim()||'#ffd60a';rdraw()}
function applyLang(){
  const r=document.documentElement;r.lang=S.lang;r.dir=S.lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.title=S.lang==='ar'?'محرر الصور':'Photo Editor';build();paintLive();if($('#set').style.display==='flex')buildSet()}
function buildSet(){
  const s=$('#sheet');s.innerHTML='<h3>'+T('settings')+'</h3>';
  const row=(l,c)=>{const r=document.createElement('div');r.className='row';const sp=document.createElement('span');sp.textContent=l;r.append(sp,c);s.appendChild(r)};
  const seg=(o,val,fn)=>{const d=document.createElement('div');d.className='seg';o.forEach(([v,t])=>{const b=document.createElement('button');b.textContent=t;b.className=v===val?'on':'';b.onclick=()=>{fn(v);saveS();buildSet()};d.appendChild(b)});return d};
  const sw=(val,fn)=>{const b=document.createElement('button');b.className='sw'+(val?' on':'');b.onclick=()=>{fn(!val);saveS();buildSet()};return b};
  row(T('theme'),seg([['auto',T('auto')],['dark',T('dark')],['light',T('light')]],S.theme,v=>{S.theme=v;applyTheme()}));
  row(T('lang'),seg([['ar','العربية'],['en','English']],S.lang,v=>{S.lang=v;applyLang()}));
  row(T('haptic'),sw(S.haptic,v=>{S.haptic=v;if(v)tick()}));
  row(T('showlab'),sw(S.showLab,v=>{S.showLab=v;lab()}));
  row(T('quality'),seg([[.8,T('q1')],[.92,T('q2')],[1,T('q3')]],S.quality,v=>{S.quality=v}));
  row(T('fmt'),seg([['jpeg','JPEG'],['png','PNG']],S.fmt,v=>{S.fmt=v}));
  const g=document.createElement('input');g.type='range';g.min=0;g.max=100;g.value=S.glass;g.oninput=()=>{S.glass=+g.value;applyTheme()};g.onchange=saveS;row(T('glass'),g);
  const n=document.createElement('button');n.className='big';n.textContent=T('newph');n.onclick=()=>{closeSet();$('#file').click()};s.appendChild(n);
  const c=document.createElement('button');c.className='big alt';c.textContent=T('close');c.onclick=closeSet;s.appendChild(c)}
function openSet(){buildSet();$('#set').style.display='flex'}
function closeSet(){$('#set').style.display='none'}
$('#set').onclick=e=>{if(e.target.id==='set')closeSet()};

/* ---------- liquid-glass tab lens you can drag ---------- */
function setMode(m){
  mode=m;build();redraw();
  if(m==='ptr'&&src&&src.depth&&!src.ptAsked){src.ptAsked=true;PT.on=true;commit();build();redraw()}}
function placeLens(i){const b=TB[i];if(!b)return;lens.style.left=b.offsetLeft+'px';lens.style.top=b.offsetTop+'px';lens.style.width=b.offsetWidth+'px';lens.style.height=b.offsetHeight+'px'}
function nearTab(cx){let bi=0,bd=1e9;TB.forEach((b,i)=>{const c=b.getBoundingClientRect(),m=Math.abs(c.left+c.width/2-cx);if(m<bd){bd=m;bi=i}});return bi}
function dragLens(cx){
  const r=tabsEl.getBoundingClientRect(),w=lens.offsetWidth,lo=Math.min(...TB.map(b=>b.offsetLeft)),hi2=Math.max(...TB.map(b=>b.offsetLeft));
  lens.style.left=clamp(cx-r.left-w/2,lo-6,hi2+6)+'px';const n=nearTab(cx);TB.forEach((b,i)=>b.classList.toggle('hov',i===n))}
tabsEl.onpointerdown=e=>{tdr=true;try{tabsEl.setPointerCapture(e.pointerId)}catch(_){};lens.classList.add('drag');dragLens(e.clientX)};
tabsEl.onpointermove=e=>{if(tdr)dragLens(e.clientX)};
tabsEl.onpointerup=e=>{if(!tdr)return;const n=nearTab(e.clientX);tdr=null;lens.classList.remove('drag');TB.forEach(b=>b.classList.remove('hov'));placeLens(n);tick();setMode(MODES[n])};
tabsEl.onpointercancel=()=>{if(tdr){tdr=null;lens.classList.remove('drag');TB.forEach(b=>b.classList.remove('hov'));placeLens(MODES.indexOf(mode))}};
window.addEventListener('resize',()=>{posCF();rdraw();placeLens(MODES.indexOf(mode));posOv()});

/* ---------- wiring ---------- */
$('#cancel').onclick=()=>{P=zero();off={};G=defG();fi=0;fint=100;autoOn=null;cst={};PT=defPT();commit();build();redraw()};
$('#pick').onclick=()=>$('#file').click();
const loadImg=u=>new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=u});
function scaled(img,max){const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c}
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!glOK)return;
  try{
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});
    const im=await loadImg(data);
    if(src){gl.deleteTexture(src.V.tex);if(src.depth)gl.deleteTexture(src.depth.tex);freeBox(VB);for(const k in VB)delete VB[k]}
    const full=scaled(im,Math.min(3000,gl.getParameter(gl.MAX_TEXTURE_SIZE))),prev=scaled(full,1600);
    src={full,prev,V:{tex:mkTex(0,0,prev),w:prev.width,h:prev.height,id:'V'+Date.now()},depth:null,thc:null};
    P=zero();off={};G=defG();fi=0;fint=100;autoOn=null;cst={};PT=defPT();strokes=[];H=[];hi=-1;commit();
    $('#empty').style.display='none';cv.style.display='block';$('#bg').style.backgroundImage='url('+scaled(full,160).toDataURL('image/jpeg',.6)+')';$('#save').disabled=false;build();render();
    /* depth data embedded by the phone camera (portrait mode) */
    try{const buf=await f.arrayBuffer();try{src.motion=findMotion(new Uint8Array(buf));keepMotion=!!src.motion;paintLive()}catch(_){}const best=await findDepth(buf,im.naturalWidth||im.width,im.naturalHeight||im.height);
      if(best&&src&&src.V.tex){src.depth=buildDepth(best,im.naturalWidth||im.width,im.naturalHeight||im.height);PT.n0=nearAt(.5,.42);if(mode==='ptr'){build()}}}catch(err){}
  }catch(err){window.__loaderr=String(err)}};

/* ---------- Live / Motion Photo (Android: JPEG with an MP4 inside) ---------- */
let keepMotion=true;
function findMotion(u8){
  if(u8[0]!==255||u8[1]!==216)return null;
  for(let i=1024;i<u8.length-12;i++){
    if(u8[i]===0x66&&u8[i+1]===0x74&&u8[i+2]===0x79&&u8[i+3]===0x70){
      const sz=((u8[i-4]<<24)|(u8[i-3]<<16)|(u8[i-2]<<8)|u8[i-1])>>>0,ok=[...u8.subarray(i+4,i+8)].every(c=>c>=32&&c<127);
      if(sz>=16&&sz<=128&&ok&&u8.length-(i-4)>2000){
        const txt=new TextDecoder('latin1').decode(u8.subarray(0,Math.min(i,300000))),m=txt.match(/MotionPhotoPresentationTimestampUs="(-?\d+)"/)||txt.match(/MicroVideoPresentationTimestampUs="(-?\d+)"/);
        return{mp4:u8.slice(i-4),ts:m?+m[1]:-1}}}}
  return null}
function addMotion(jpeg,m){
  const n=m.mp4.length,ts=m.ts;
  const xml='<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?><x:xmpmeta xmlns:x="adobe:ns:meta/"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:GCamera="http://ns.google.com/photos/1.0/camera/" xmlns:Container="http://ns.google.com/photos/1.0/container/" xmlns:Item="http://ns.google.com/photos/1.0/container/item/" GCamera:MotionPhoto="1" GCamera:MotionPhotoVersion="1" GCamera:MotionPhotoPresentationTimestampUs="'+ts+'" GCamera:MicroVideo="1" GCamera:MicroVideoVersion="1" GCamera:MicroVideoOffset="'+n+'" GCamera:MicroVideoPresentationTimestampUs="'+ts+'"><Container:Directory><rdf:Seq><rdf:li rdf:parseType="Resource"><Container:Item Item:Mime="image/jpeg" Item:Semantic="Primary" Item:Length="0" Item:Padding="0"/></rdf:li><rdf:li rdf:parseType="Resource"><Container:Item Item:Mime="video/mp4" Item:Semantic="MotionPhoto" Item:Length="'+n+'" Item:Padding="0"/></rdf:li></rdf:Seq></Container:Directory></rdf:Description></rdf:RDF></x:xmpmeta><?xpacket end="w"?>';
  const body=new TextEncoder().encode('http://ns.adobe.com/xap/1.0/\0'+xml),len=body.length+2;
  let at=2;if(jpeg[2]===255&&jpeg[3]===224)at=4+((jpeg[4]<<8)|jpeg[5]);
  const out=new Uint8Array(jpeg.length+4+body.length+n);
  out.set(jpeg.subarray(0,at),0);out[at]=255;out[at+1]=225;out[at+2]=len>>8;out[at+3]=len&255;out.set(body,at+4);
  out.set(jpeg.subarray(at),at+4+body.length);out.set(m.mp4,jpeg.length+4+body.length);return out}
function paintLive(){
  const b=$('#live');if(!src||!src.motion){b.style.display='none';return}
  b.style.display='flex';b.classList.toggle('offl',!keepMotion);
  b.innerHTML=I('<circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="9.4" stroke-dasharray="2 2.4"/>')+'<span>'+T('live')+'</span>'}
$('#live').onclick=()=>{keepMotion=!keepMotion;paintLive();tick()};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
const blobB64=bl=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(bl)});
async function doSave(){
  if(!src)return;
  const c=exportCanvas(),motion=!!(src.motion&&keepMotion),type=(motion||S.fmt!=='png')?'image/jpeg':'image/png';
  let bl=await new Promise(r=>c.toBlob(r,type,S.quality)),name=type==='image/png'?'edited.png':'edited.jpg';
  if(motion){bl=new Blob([addMotion(new Uint8Array(await bl.arrayBuffer()),src.motion)],{type:'image/jpeg'});name='MVIMG_edited.jpg'}
  if(window.AndroidBridge){
    try{const r=AndroidBridge.save(await blobB64(bl),name,type);toast(r==='ok'?T('saved'):T('savefail'))}catch(e){toast(T('savefail'))}
    return}
  try{const file=new File([bl],name,{type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){}
  $('#oi').src=URL.createObjectURL(bl);$('#ov').style.display='flex'}
$('#save').onclick=doSave;
$('#oc').onclick=()=>$('#ov').style.display='none';
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()})}catch(e){}
let tapT=0;
cv.addEventListener('click',e=>{
  if(!src||pen)return;
  if(mode==='ptr'&&src.depth){
    const r=cv.getBoundingClientRect(),q=mapUV((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height);
    PT.n0=nearAt(q.x,q.y);PT.on=true;const rt2=$('#rt'),sr=$('#stage').getBoundingClientRect();rt2.style.display='none';void rt2.offsetWidth;rt2.style.left=(e.clientX-sr.left)+'px';rt2.style.top=(e.clientY-sr.top)+'px';rt2.style.display='block';setTimeout(()=>{rt2.style.display='none'},1300);
    tick();commit();paintPt();redraw();return}
  if(mode==='crop'||orig)return;
  orig=true;const l=$('#lab');l.style.display='block';l.textContent=T('orig');redraw();
  clearTimeout(tapT);tapT=setTimeout(()=>{orig=false;lab();redraw()},1000)});
if(!glOK){$('#empty').innerHTML='<span>'+T('nogl')+'</span>'}
applyTheme();applyLang();
</script>
